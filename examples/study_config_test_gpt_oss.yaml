# Example study configuration for MLPerf Harness - Server Scenario on Kubernetes
# This uses the direct Kubernetes Deployment/Pod backend (no Helm)
# Simpler than Helm backend - creates Deployments and Services directly

study:
  prefix: "autotune_test_gpt_oss"
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna-k8s-direct"
  # For Kubernetes: Use port-forwarding or cluster-internal database URL
  # Example with port-forward: kubectl port-forward -n <namespace> svc/postgresql 5432:5432

# Execution backend configuration for Kubernetes (direct Deployment/Pod)
execution:
  backend: "k8s"  # or "kubernetes"
  k8s:
    namespace: "autotune-aanya"  # Kubernetes namespace for deployments
    vllm_image: "vllm/vllm-openai:latest"  # vLLM container image
    benchmark_image: "quay.io/rh-ee-aansharm/mlperf-6.0@sha256:ac63fa7a124c6901ce6538f7f1fd52ef6d7c328a1bbd300fbe187d2104901b8b"
    service_type: "ClusterIP"  # Service type: ClusterIP, NodePort, or LoadBalancer
    service_port: 8000  # Service port for vLLM server
    kubeconfig: "/Users/aansharm/.kube/config"  # Optional: custom kubeconfig path
    model_pvc: "model-cache-pvc"
    benchmark_pvc: "results-pvc-mlperf"  # REQUIRED: PersistentVolumeClaim for benchmark results storage
    # Optional: Resource requests and limits
    resource_requests:
      nvidia.com/gpu: "8"
    resource_limits:
      nvidia.com/gpu: "8"

optimization:
  # Single objective: Optimize throughput
  approach: "single_objective"
  objectives:
    - metric: "output_tokens_per_second"  # MLPerf throughput metric
      direction: "maximize"
      percentile: "median"
  sampler: "tpe"  # Tree-structured Parzen Estimator
  n_trials: 50
  n_startup_trials: 1
  # skip_baseline: true
  # Note: Kubernetes backend only supports sequential trials (max_concurrent_trials=1)

benchmark:
  # Constants: fixed values for all trials
  benchmark_type: "mlperf"
  model: "openai/gpt-oss-120b"  # GPT-OSS 120B model (on PVC)
  scenario: "Offline"  # MLPerf Offline scenario
  dataset_path: "/vllm-workspace/mlperf-inference-6.0-redhat/harness/data/v4/perf_eval_ref.parquet"  # v4 dataset (in container)
  lg_model_name: "gpt-oss-120b"  # LoadGen model name for GPT-OSS
  num_samples: 6396  # Full MLPerf dataset (all samples)
  output_dir: "/mnt/results/harness-output"  # Output directory for results (on PVC to preserve error logs)
  mlflow_experiment_name: "autotune-gpt-oss-120b-offline"  # MLflow experiment name
  mlflow_host: "150.239.115.202"  # MLflow host address (must be accessible from pods)
  test_mode: "performance"  # Test mode: performance or accuracy
  max_seconds: 5400  # 90 minutes for 6396 samples (based on 1hr actual runtime + margin, timeout = 5400 * 1.5 = 8100s = 2.25 hours)
  # Tunables: optimized by Optuna
  tunables: {}  # Empty - no tunables for Offline scenario

logging:
  # At least one of the following must be provided and must be valid
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna-k8s-direct"
  file_path: "/tmp/auto-tune-vllm-logs"  # Local file path (on the machine running auto-tune)
  log_level: "INFO"

parameters:
  # vLLM parameters to optimize
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 16384
    step: 2048
    
  gpu_memory_utilization:
    enabled: true
    min: 0.85
    max: 0.95
    step: 0.05
    
  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]
    
  max_num_seqs:
    enabled: true
    min: 32
    max: 256
    step: 32

# Static parameters (applied to all trials)
static_parameters:
  tensor_parallel_size: 8  # Use 8 GPU per trial
  max_model_len: 131072  # Full GPT-OSS context length (required for MLPerf dataset)
